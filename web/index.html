<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Digital World — Genesis</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div><div class="eyebrow">DIGITAL WORLD</div><h1>Genesis</h1></div>
  <div id="status" class="status">CONNECTING</div>
</header>
<main>
  <section class="world">
    <div class="orb"><div class="core"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div>
    <div class="being-name">GENESIS</div>
    <div id="tick">Tick 0</div>
  </section>
  <section class="grid">
    <article><span>WORLD</span><strong id="world">—</strong></article>
    <article><span>TOOLS</span><strong id="tools">0</strong></article>
    <article><span>MEMORY</span><strong id="memory">0</strong></article>
    <article><span>LEARNING</span><strong id="learning">0</strong></article>
  </section>
  <section class="panel"><h2>Live Activity</h2><pre id="events">Waiting for Genesis...</pre></section>
  <button id="kill">EMERGENCY KILL SWITCH</button>
</main>
<script src="/app.js"></script>
</body>
</html>
