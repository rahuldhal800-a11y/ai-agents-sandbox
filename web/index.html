<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110d"><title>Genesis — Digital World</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="world3d" aria-label="WebGL-free software rendered 3D Genesis world"></div>
<div class="hud">
<header class="topbar"><div><div class="eyebrow">GENESIS WORLD / LIVE SIMULATION</div><h1>Genesis</h1><p>Enter the world. Observe the being. Talk to it.</p></div><div id="status" class="status">CONNECTING</div></header>
<div class="world-hud"><div class="hud-chip"><span>TICK</span><b id="tick">0</b></div><div class="hud-chip"><span>POSITION</span><b id="position">—</b></div><div class="hud-chip"><span>ENERGY</span><b id="energy">—</b></div><div class="hud-chip"><span>AGE</span><b id="age">—</b></div></div>
<div class="world-actions"><button id="follow">FOLLOW GENESIS</button><button id="resetView">RESET VIEW</button></div>
<button id="kill" class="kill">EMERGENCY KILL SWITCH</button>
<section class="bottom-panel"><div class="panel-head"><div><div class="eyebrow">DIRECT CONTACT</div><h2>Talk to Genesis</h2></div><span id="voiceState" class="voice-state">VOICE READY</span></div>
<div id="conversation" class="conversation"><div class="bubble genesis"><span>GENESIS</span><p>I am awake inside my world. You can talk to me.</p></div></div>
<div class="composer"><button id="mic" class="mic">🎙️</button><input id="message" autocomplete="off" placeholder="Talk to Genesis..."><button id="send" class="send">SEND</button></div></section>
<div class="world-labels"><span>🌲 FOREST</span><span>💧 WATER</span><span>🏠 BUILDINGS</span><span>💻 COMPUTER LAB</span><span>🧠 GENESIS</span></div>
</div>
<script src="/app.js"></script><script src="/world2d.js"></script></body></html>
